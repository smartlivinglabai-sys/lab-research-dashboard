<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Living Lab 연구 대시보드</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface-1: #fcfcfb;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --grid: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-soft: #cde2fb;
    --seq-250: #86b6ef;
    --seq-400: #3987e5;
    --seq-550: #1c5cab;
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
    --status-critical: #d03b3b;
    --good-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface-1: #1a1a19;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --grid: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --accent-soft: #104281;
      --seq-250: #256abf;
      --seq-400: #3987e5;
      --seq-550: #86b6ef;
      --good-text: #0ca30c;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--page); color: var(--text-primary);
    line-height: 1.55; font-size: 14px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }

  header.top { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  header.top h1 { font-size: 20px; font-weight: 700; }
  header.top .sub { color: var(--text-muted); font-size: 12.5px; }

  .tiles { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:10px; margin-bottom:20px; }
  .tile { background: var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .tile .label { font-size:12px; color: var(--text-secondary); margin-bottom:2px; }
  .tile .value { font-size:26px; font-weight:700; }
  .tile .hint { font-size:11.5px; color: var(--text-muted); margin-top:2px; }

  nav.tabs { display:flex; gap:4px; border-bottom:1px solid var(--grid); margin-bottom:18px; flex-wrap:wrap; }
  nav.tabs button {
    appearance:none; background:none; border:none; cursor:pointer;
    font: inherit; font-size:13.5px; font-weight:600; color: var(--text-secondary);
    padding:9px 14px; border-bottom:2px solid transparent; margin-bottom:-1px;
  }
  nav.tabs button.active { color: var(--text-primary); border-bottom-color: var(--accent); }
  nav.tabs button:hover { color: var(--text-primary); }

  section.panel { display:none; }
  section.panel.active { display:block; }

  .card { background: var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:16px 18px; margin-bottom:12px; }
  .card h3 { font-size:14.5px; font-weight:700; margin-bottom:4px; }
  .card .meta { font-size:12px; color: var(--text-muted); margin-bottom:6px; }
  .card p.desc { font-size:13px; color: var(--text-secondary); margin-bottom:8px; }
  .card a { color: var(--accent); text-decoration:none; }
  .card a:hover { text-decoration:underline; }

  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .chip {
    font-size:11.5px; padding:2px 9px; border-radius:999px;
    background: var(--page); border:1px solid var(--grid); color: var(--text-secondary);
    cursor:pointer; user-select:none;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color:#fff; }
  .chip.static { cursor:default; }

  .badge { display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:999px; border:1px solid var(--border); }
  .badge.idea { color: var(--text-secondary); }
  .badge.reviewing { color: var(--status-warning); }
  .badge.active-st { color: var(--good-text); }
  .badge .dot { width:7px; height:7px; border-radius:50%; background: currentColor; }

  .relbar { height:5px; background: var(--grid); border-radius:3px; overflow:hidden; margin-top:8px; }
  .relbar > i { display:block; height:100%; background: var(--accent); border-radius:3px; }

  .scores { display:grid; grid-template-columns: repeat(5, 1fr); gap:8px; margin:10px 0 4px; }
  .score .sl { font-size:11px; color: var(--text-muted); margin-bottom:3px; display:flex; justify-content:space-between; }
  .score .sl b { color: var(--text-primary); font-weight:700; }
  .score .bar { height:6px; background: var(--grid); border-radius:3px; overflow:hidden; }
  .score .bar > i { display:block; height:100%; border-radius:3px; background: var(--seq-400); }
  .total { font-size:12.5px; color: var(--text-secondary); margin-top:6px; }
  .total b { font-size:15px; color: var(--text-primary); }

  .toolbar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar .lbl { font-size:12px; color: var(--text-muted); }
  select {
    font:inherit; font-size:12.5px; padding:5px 8px; border-radius:8px;
    border:1px solid var(--grid); background: var(--surface-1); color: var(--text-primary);
  }

  .notice { background: var(--surface-1); border:1px dashed var(--baseline); border-radius:10px; padding:22px; text-align:center; color: var(--text-secondary); }
  .notice .big { font-size:15px; font-weight:700; color: var(--text-primary); margin-bottom:6px; }
  .notice ol { text-align:left; max-width:520px; margin:12px auto 0; font-size:13px; padding-left:20px; }
  .notice ol li { margin-bottom:6px; }

  table.tbl { width:100%; border-collapse:collapse; font-size:13px; background:var(--surface-1); border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  table.tbl th { text-align:left; font-size:12px; color:var(--text-muted); font-weight:600; padding:9px 12px; border-bottom:1px solid var(--grid); }
  table.tbl td { padding:9px 12px; border-bottom:1px solid var(--grid); vertical-align:top; }
  table.tbl tr:last-child td { border-bottom:none; }

  .section-note { font-size:12.5px; color: var(--text-muted); margin-bottom:14px; }
  .agent-tag { font-size:11px; color: var(--text-muted); background: var(--page); border:1px solid var(--grid); border-radius:5px; padding:1px 6px; }
  .idx { display:inline-block; font-size:10.5px; font-weight:700; color: var(--accent); background: var(--accent-soft); border-radius:5px; padding:1px 7px; letter-spacing:.02em; }
  .idx.n { color: var(--text-secondary); background: var(--page); border:1px solid var(--grid); font-weight:600; }
  footer { margin-top:28px; font-size:11.5px; color: var(--text-muted); text-align:center; }
</style>
</head>

const SCORE_LABELS = {novelty:"신규성", data:"데이터", feasibility:"실현성", fit:"적합도", impact:"파급력"};
const $ = s => document.querySelector(s);

document.getElementById('updated').textContent = "마지막 갱신: " + DATA.updated;

/* ---- tiles ---- */
(function(){
  const t = [
    {label:"검색 주제", value: DATA.searchTopics.filter(x=>x.enabled).length, hint:"에이전트 병렬 실행 대상"},
    {label:"수집 논문", value: DATA.papers.length, hint:"Paper agent"},
    {label:"연구주제 후보", value: DATA.candidates.length, hint:"Topic agent"},
    {label:"학생 연구", value: DATA.students.connected ? DATA.students.items.length : "–", hint: DATA.students.connected ? "Notion 동기화" : "Notion 연동 대기"}
  ];
  $('#tiles').innerHTML = t.map(x=>`<div class="tile"><div class="label">${x.label}</div><div class="value">${x.value}</div><div class="hint">${x.hint}</div></div>`).join('');
})();

/* ---- tabs ---- */
document.getElementById('tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('active', x===b));
  document.querySelectorAll('section.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+b.dataset.tab).classList.add('active');
});

/* ---- search topics ---- */
(function(){
  $('#qtopics').innerHTML = DATA.searchTopics.map(q=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <h3>${q.name} <span class="agent-tag">${q.id}</span></h3>
        <span class="badge active-st"><span class="dot"></span>활성</span>
      </div>
      <div class="meta">등록일 ${q.added} · 논문 ${q.stats.papers}건 · 주제 후보 ${q.stats.candidates}건</div>
      <div class="chips">${q.keywords.map(k=>`<span class="chip static">${k}</span>`).join('')}</div>
    </div>`).join('');
})();

/* ---- papers ---- */
let kwFilter = null;
function renderKw(){
  const all = [...new Set(DATA.papers.flatMap(p=>p.keywords))];
  $('#kwchips').innerHTML = all.map(k=>`<span class="chip ${kwFilter===k?'on':''}" data-k="${k}">${k}</span>`).join('');
}
function renderPapers(){
  const sort = $('#paperSort').value;
  let list = [...DATA.papers];
  if (kwFilter) list = list.filter(p=>p.keywords.includes(kwFilter));
  const idxF = $('#idxFilter').value;
  if (idxF) list = list.filter(p=>(p.index||[]).includes(idxF));
  list.sort((a,b)=> sort==='year' ? b.year-a.year || b.relevance-a.relevance : b.relevance-a.relevance);
  $('#papers').innerHTML = list.map(p=>`
    <div class="card">
      <h3><a href="${p.url}" target="_blank" rel="noopener">${p.title}</a></h3>
      <div class="meta">${p.authors} · ${p.venue} · ${p.year} &nbsp;${(p.index||[]).map(ix=>`<span class="idx ${(ix==='Preprint'||ix==='정책자료')?'n':''}">${ix}</span>`).join(' ')}&nbsp; <span class="agent-tag">관련도 ${Math.round(p.relevance*100)}%</span></div>
      <p class="desc">${p.summary}</p>
      <div class="chips">${p.keywords.map(k=>`<span class="chip static">${k}</span>`).join('')}</div>
      <div class="relbar" title="관련도 ${Math.round(p.relevance*100)}%"><i style="width:${p.relevance*100}%"></i></div>
    </div>`).join('') || '<div class="notice">해당 키워드의 논문이 없습니다.</div>';
}
$('#kwchips').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  kwFilter = (kwFilter === c.dataset.k) ? null : c.dataset.k;
  renderKw(); renderPapers();
});
$('#paperSort').addEventListener('change', renderPapers);
$('#idxFilter').addEventListener('change', renderPapers);
renderKw(); renderPapers();

/* ---- candidates ---- */
function totalScore(s){ return s.novelty+s.data+s.feasibility+s.fit+s.impact; }
function renderCands(){
  const sort = $('#candSort').value;
  let list = [...DATA.candidates];
  list.sort((a,b)=> sort==='total' ? totalScore(b.s)-totalScore(a.s) : b.s[sort]-a.s[sort]);
  $('#cands').innerHTML = list.map(c=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <h3>${c.title}</h3>
        <span class="badge idea"><span class="dot"></span>아이디어</span>
      </div>
      <div class="meta">${c.id} · 평가 모델: ${c.model} <span class="agent-tag">검색주제 ${c.topic}</span></div>
      <p class="desc">${c.desc}</p>
      <div class="scores">
        ${Object.keys(SCORE_LABELS).map(k=>`
          <div class="score">
            <div class="sl"><span>${SCORE_LABELS[k]}</span><b>${c.s[k]}</b></div>
            <div class="bar"><i style="width:${c.s[k]*20}%"></i></div>
          </div>`).join('')}
      </div>
      <div class="total">종합 <b>${totalScore(c.s)}</b> / 25 &nbsp;·&nbsp; <span style="color:var(--text-muted)">${c.rationale}</span></div>
    </div>`).join('');
}
$('#candSort').addEventListener('change', renderCands);
renderCands();

/* ---- students ---- */
(function(){
  const el = $('#studentsBody');
  if (!DATA.students.connected) {
    el.innerHTML = `
      <div class="notice">
        <div class="big">🎓 학생 연구 관리 — Notion 연동 대기 중</div>
        현재 Notion으로 관리 중인 학생 연구 현황을 이 탭에서 바로 볼 수 있습니다.<br>연동을 완료하려면:
        <ol>
          <li>Claude 앱의 <b>설정 → 커넥터</b>에서 <b>Notion</b>을 검색해 연결(로그인·권한 승인)합니다.</li>
          <li>이 채팅의 커넥터 설정에서 Notion을 <b>활성화</b>합니다.</li>
          <li>채팅에서 "학생 연구 Notion 데이터베이스를 대시보드에 동기화해줘"라고 요청하면, Student agent가 Notion 데이터를 읽어 이 탭을 채웁니다.</li>
        </ol>
        <div style="margin-top:12px;font-size:12px;color:var(--text-muted)">연동 후에는 에이전트 실행 시마다 학생별 연구 주제·진행 상태·최근 업데이트가 자동 반영됩니다.</div>
      </div>`;
    return;
  }
  el.innerHTML = `<table class="tbl">
    <thead><tr><th>학생</th><th>연구 주제</th><th>상태</th><th>최근 업데이트</th><th>비고</th></tr></thead>
    <tbody>${DATA.students.items.map(s=>`<tr><td>${s.name}</td><td>${s.topic}</td><td>${s.status}</td><td>${s.updated}</td><td>${s.note||''}</td></tr>`).join('')}</tbody>
  </table>`;
})();
</script>
</body>
</html>
