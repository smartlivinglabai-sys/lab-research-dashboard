/* ---- papers ---- */
let kwFilter = null;
function renderKw(){
  const all = [...new Set(DATA.papers.flatMap(p=>p.keywords))];
  $('#kwchips').innerHTML = all.map(k=>`<span class="chip ${kwFilter===k?'on':''}" data-k="${k}">${k}</span>`).join('');
}
function renderPapers(){
  const sort = $('#paperSort').value;
  let list = [...DATA.papers];
  if (kwFilter) list = list.filter(p=>p.keywords.includes(kwFilter));
  const idxF = $('#idxFilter').value;
  if (idxF) list = list.filter(p=>(p.index||[]).includes(idxF));
  list.sort((a,b)=> sort==='year' ? b.year-a.year || b.relevance-a.relevance : b.relevance-a.relevance);
  $('#papers').innerHTML = list.map(p=>`
    <div class="card">
      <h3><a href="${p.url}" target="_blank" rel="noopener">${p.title}</a></h3>
      <div class="meta">${p.authors} · ${p.venue} · ${p.year} &nbsp;${(p.index||[]).map(ix=>`<span class="idx ${(ix==='Preprint'||ix==='정책자료')?'n':''}">${ix}</span>`).join(' ')}&nbsp; <span class="agent-tag">관련도 ${Math.round(p.relevance*100)}%</span></div>
      <p class="desc">${p.summary}</p>
      <div class="chips">${p.keywords.map(k=>`<span class="chip static">${k}</span>`).join('')}</div>
      <div class="relbar" title="관련도 ${Math.round(p.relevance*100)}%"><i style="width:${p.relevance*100}%"></i></div>
    </div>`).join('') || '<div class="notice">해당 키워드의 논문이 없습니다.</div>';
}
$('#kwchips').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  kwFilter = (kwFilter === c.dataset.k) ? null : c.dataset.k;
  renderKw(); renderPapers();
});
$('#paperSort').addEventListener('change', renderPapers);
$('#idxFilter').addEventListener('change', renderPapers);
renderKw(); renderPapers();

/* ---- candidates ---- */
function totalScore(s){ return s.novelty+s.data+s.feasibility+s.fit+s.impact; }
function renderCands(){
  const sort = $('#candSort').value;
  let list = [...DATA.candidates];
  list.sort((a,b)=> sort==='total' ? totalScore(b.s)-totalScore(a.s) : b.s[sort]-a.s[sort]);
  $('#cands').innerHTML = list.map(c=>`
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">
        <h3>${c.title}</h3>
        <span class="badge idea"><span class="dot"></span>아이디어</span>
      </div>
      <div class="meta">${c.id} · 평가 모델: ${c.model} <span class="agent-tag">검색주제 ${c.topic}</span></div>
      <p class="desc">${c.desc}</p>
      <div class="scores">
        ${Object.keys(SCORE_LABELS).map(k=>`
          <div class="score">
            <div class="sl"><span>${SCORE_LABELS[k]}</span><b>${c.s[k]}</b></div>
            <div class="bar"><i style="width:${c.s[k]*20}%"></i></div>
          </div>`).join('')}
      </div>
      <div class="total">종합 <b>${totalScore(c.s)}</b> / 25 &nbsp;·&nbsp; <span style="color:var(--text-muted)">${c.rationale}</span></div>
    </div>`).join('');
}
$('#candSort').addEventListener('change', renderCands);
renderCands();
